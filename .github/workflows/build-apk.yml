name: APK Derle

# Elle tetikleme veya sürüm etiketi ile çalışır.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (artırma)"
        required: true
        default: "2"
      versionName:
        description: "versionName"
        required: true
        default: "1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOT: android-actions/setup-android@v3 "Failed to find package 'tools'"
      # hatası veriyor (cmdline-tools 16.0 + sdkmanager uyumsuz).
      # Bu yüzden SDK elle kuruluyor.
      - name: Android SDK kur
        run: |
          set -e
          export ANDROID_HOME=$HOME/Android/Sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # $GITHUB_PATH yalnız SONRAKİ adımlarda geçerli — bu adımda tam yol gerekir.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle dağıtımını kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # İmzalama anahtarı repoda YOK. Secret'ta saklanan gerçek keystore
      # geri yazılır — böylece CI çıktısı, sunucudaki APK ile **aynı
      # sertifikayı** taşır ve kullanıcının uygulaması güncelleme olur.
      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.MIM_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p keys
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > keys/mim-release.jks
            echo "keystore secret'tan geri yazıldı"
            keytool -list -v -keystore keys/mim-release.jks \
              -storepass "${{ secrets.MIM_STORE_PASSWORD }}" \
              -alias "${{ secrets.MIM_KEY_ALIAS }}" 2>/dev/null \
              | grep -i "SHA256:" || true
          else
            echo "::warning::MIM_KEYSTORE_BASE64 secret'ı yok — imzasız APK derlenecek"
            keytool -genkeypair -v -keystore keys/mim-release.jks \
              -alias "${MIM_KEY_ALIAS:-mim}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${MIM_STORE_PASSWORD:-changeit}" \
              -keypass "${MIM_KEY_PASSWORD:-changeit}" \
              -dname "CN=Mim Hali Yikama, OU=Isletme, O=Mim Hali Yikama, L=Istanbul, C=TR" 2>/dev/null
          fi

      - name: Sürüm bilgisini belirle
        id: ver
        env:
          ALIAS: ${{ secrets.MIM_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VC=$(echo "${{ github.ref_name }}" | sed 's/^v//' | tr -d '.' | cut -c1-4)
            VN=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VC="${{ inputs.versionCode }}"
            VN="${{ inputs.versionName }}"
          fi
          echo "versionCode=$VC" >> $GITHUB_OUTPUT
          echo "versionName=$VN" >> $GITHUB_OUTPUT
          echo "Sürüm: $VN (kod $VC)"

      - name: Release APK derle
        env:
          MIM_STORE_FILE: ${{ github.workspace }}/keys/mim-release.jks
          MIM_STORE_PASSWORD: ${{ secrets.MIM_STORE_PASSWORD }}
          MIM_KEY_ALIAS: ${{ secrets.MIM_KEY_ALIAS }}
          MIM_KEY_PASSWORD: ${{ secrets.MIM_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PversionCode=${{ steps.ver.outputs.versionCode }} \
            -PversionName=${{ steps.ver.outputs.versionName }}

      - name: APK'yı doğrula
        env:
          MIM_STORE_PASSWORD: ${{ secrets.MIM_STORE_PASSWORD }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          if [ -n "$MIM_STORE_PASSWORD" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | head -12
          fi
          cp "$APK" "MimHaliYikama-${{ steps.ver.outputs.versionName }}.apk"

      - name: Sürüm varlığı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: MimHaliYikama-${{ steps.ver.outputs.versionName }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            MimHaliYikama-*.apk
          retention-days: 90

      - name: GitHub Release (etiketle tetiklendiyse)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Mim Halı Yıkama ${{ steps.ver.outputs.versionName }}" \
            --notes "Native Android uygulaması — otomatik derleme."
