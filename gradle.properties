# Bu makinede toplam RAM ~1.6 GB. Gradle + Kotlin derleyici ayrı JVM'ler
# açtığı için bellek sınırları düşük tutulmalı; aksi halde OOM killer
# daemon'ı öldürüyor ("Gradle build daemon disappeared").
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin derleyicisi ayrı bir daemon JVM açmasın — Gradle JVM'i içinde
# çalışsın (tek JVM = tek bellek yükü).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx400m

# Uygulama sürümü (panelde gösterilir; CI'da -PversionCode/-PversionName ile geçilir)
versionCode=1
versionName=1.0
